# Seed the Google product-taxonomy categories into MongoDB Atlas from Cloud Build
# (runs inside GCP, which can reach Atlas; local networks often block port 27017).
# Source = ./ecommerce-backend. MONGODB_URI comes from Secret Manager.
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npm run seed:categories'
    secretEnv: ['MONGODB_URI']
    env:
      - 'MONGODB_DB_NAME=ecommerce'
availableSecrets:
  secretManager:
    - versionName: 'projects/suuq-ecommerce/secrets/MONGODB_URI/versions/latest'
      env: 'MONGODB_URI'
options:
  logging: CLOUD_LOGGING_ONLY
