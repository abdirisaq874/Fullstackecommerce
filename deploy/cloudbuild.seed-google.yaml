# Seed the FULL Google Product Taxonomy into MongoDB Atlas from Cloud Build.
# Source = ./ecommerce-backend. MONGODB_URI comes from Secret Manager.
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npx ts-node src/database/seed-google-taxonomy.ts'
    secretEnv: ['MONGODB_URI']
    env:
      - 'MONGODB_DB_NAME=ecommerce'
availableSecrets:
  secretManager:
    - versionName: 'projects/suuq-ecommerce/secrets/MONGODB_URI/versions/latest'
      env: 'MONGODB_URI'
options:
  logging: CLOUD_LOGGING_ONLY
