# Suuq — Docker Swarm stack (single node): Caddy ingress + 3 apps + Redis + OpenSearch.
# MongoDB stays on Atlas. Secrets are injected via ${VAR} substitution at deploy
# time (deploy.sh pulls them from Secret Manager). Deploy:
#   docker stack deploy -c stack.yml suuq --with-registry-auth --prune
version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - { target: 80,  published: 80,  mode: host }
      - { target: 443, published: 443, mode: host }
    # Basic-auth credentials for search.gaarsiiglobal.com (OpenSearch Dashboards).
    # Caddy reads these at runtime via {$SEARCH_ADMIN_USER}/{$SEARCH_ADMIN_HASH}.
    # HASH is a bcrypt hash from Secret Manager (deploy.sh); ":?" aborts the
    # deploy if it is missing so we never ship the dashboard with empty auth.
    environment:
      SEARCH_ADMIN_USER: ${SEARCH_ADMIN_USER:-admin}
      SEARCH_ADMIN_HASH: ${SEARCH_ADMIN_HASH:?set the SEARCH_ADMIN_HASH secret (bcrypt) before deploying}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  storefront:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/storefront:latest
    environment:
      PORT: "8080"
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  seller-portal:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/seller-portal:latest
    environment:
      PORT: "8080"
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  backend:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/ecommerce-backend:latest
    environment: &backend_env
      NODE_ENV: production
      PORT: "3000"
      API_PREFIX: api/v1
      MONGODB_DB_NAME: ecommerce
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENSEARCH_NODE: http://opensearch:9200
      SEARCH_PRODUCT_INDEX: products_v1
      SEARCH_DEFAULT_LOCALE: en
      SEARCH_LOCALES: "en,so"
      # Hybrid search: BM25 + Qwen3 semantic vectors. Tuned so cold embeds fall
      # back to lexical fast, and only strong (>=0.85 cosine) vector hits count.
      SEARCH_ENABLE_VECTOR: "1"
      SEARCH_ENABLE_RERANK: "0"
      SEARCH_ENABLE_QUERY_UNDERSTANDING: "0"
      SEARCH_ENABLE_TRANSLATION: "0"
      SEARCH_VECTOR_MIN_SCORE: "0.6"
      # Higher budget so the hosted embed usually finishes → reliable
      # cross-lingual/semantic search (trade-off: searches wait for the embed).
      SEARCH_QUERY_EMBED_TIMEOUT_MS: "2500"
      EMBEDDINGS_PROVIDER: openrouter
      EMBEDDINGS_DIMS: "1024"
      COHERE_API_KEY: ${COHERE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      # Seller AI: Gemma-4-26b handles copy + vision; Qwen3 embeds for category match.
      OPENROUTER_GEN_MODEL: google/gemma-4-26b-a4b-it
      OPENROUTER_VISION_MODEL: google/gemma-4-26b-a4b-it
      OPENROUTER_EMBED_MODEL: qwen/qwen3-embedding-8b
      # Somali product translation — Gemini via its OpenAI-compatible endpoint.
      # GEMINI_API_KEY is injected from Secret Manager (deploy.sh); never hardcoded.
      TRANSLATION_ENABLED: "1"
      TRANSLATION_PROVIDER: gemini
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      GEMINI_TRANSLATION_MODEL: gemini-3.5-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Cloudflare R2 (S3-compatible) — product image uploads
      R2_ENDPOINT: https://c6afd8d77de48b568e4432620c142398.r2.cloudflarestorage.com
      R2_BUCKET: gaarsii-e-commerce-storage
      R2_PUBLIC_BASE_URL: https://pub-91ea59ccc4b349b0826f014f8bcab5ca.r2.dev
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: usd
      MAIL_HOST: smtp.sendgrid.net
      MAIL_PORT: "587"
      MAIL_USER: apikey
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: Gaarsii <noreply@gaarsiiglobal.com>
      MAIL_FROM_NAME: Suuq
      # ── Resend (transactional email) ──
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      MAIL_REPLY_TO: support@gaarsiiglobal.com
      PLATFORM_NAME: Gaarsii
      # ── Meta (Facebook) Conversions API — server-side Purchase events ──
      # Pixel/Dataset id is public; the access token is a secret from Secret
      # Manager (deploy.sh). Empty token ⇒ CAPI no-ops (browser pixel still fires).
      META_PIXEL_ID: "1638279067369914"
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN}
      STORAGE_PROVIDER: s3
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      FRONTEND_URL: "https://shop.gaarsiiglobal.com,https://seller.gaarsiiglobal.com"
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  # Dedicated workers process: same image, headless worker entrypoint. Runs the
  # mail consumer (BullMQ). The API process runs the outbox poller; the worker
  # must NOT (poller stays single). Shares the backend env (Mongo/Redis/Resend).
  worker:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/ecommerce-backend:latest
    command: ["node", "dist/worker.js"]
    environment: *backend_env
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  # OpenSearch Dashboards — index inspection & relevance tuning UI. Reachable
  # ONLY over the overlay network; Caddy fronts it at search.gaarsiiglobal.com
  # with basic-auth (the OpenSearch security plugin itself is disabled). No host
  # port is published, so it is never exposed except through Caddy.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

configs:
  caddyfile:
    file: ./Caddyfile

networks:
  suuq:
    driver: overlay

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  opensearch_data:
