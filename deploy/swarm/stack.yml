# Suuq — Docker Swarm stack (single node): Caddy ingress + 3 apps + Redis + OpenSearch.
# MongoDB stays on Atlas. Secrets are injected via ${VAR} substitution at deploy
# time (deploy.sh pulls them from Secret Manager). Deploy:
#   docker stack deploy -c stack.yml suuq --with-registry-auth --prune
version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - { target: 80,  published: 80,  mode: host }
      - { target: 443, published: 443, mode: host }
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  storefront:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/storefront:latest
    environment:
      PORT: "8080"
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  seller-portal:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/seller-portal:latest
    environment:
      PORT: "8080"
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  backend:
    image: us-central1-docker.pkg.dev/suuq-ecommerce/apps/ecommerce-backend:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_PREFIX: api/v1
      MONGODB_DB_NAME: ecommerce
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENSEARCH_NODE: http://opensearch:9200
      SEARCH_PRODUCT_INDEX: products_v1
      SEARCH_DEFAULT_LOCALE: en
      SEARCH_LOCALES: "en,so"
      SEARCH_ENABLE_VECTOR: "0"
      SEARCH_ENABLE_RERANK: "0"
      SEARCH_ENABLE_QUERY_UNDERSTANDING: "0"
      SEARCH_ENABLE_TRANSLATION: "0"
      EMBEDDINGS_PROVIDER: cohere
      EMBEDDINGS_DIMS: "1024"
      COHERE_API_KEY: ${COHERE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      # Seller AI: Gemma-4-26b handles copy + vision; Qwen3 embeds for category match.
      OPENROUTER_GEN_MODEL: google/gemma-4-26b-a4b-it
      OPENROUTER_VISION_MODEL: google/gemma-4-26b-a4b-it
      OPENROUTER_EMBED_MODEL: qwen/qwen3-embedding-8b
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: usd
      MAIL_HOST: smtp.sendgrid.net
      MAIL_PORT: "587"
      MAIL_USER: apikey
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: noreply@gaarsiiglobal.com
      MAIL_FROM_NAME: Suuq
      STORAGE_PROVIDER: s3
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      FRONTEND_URL: "https://shop.gaarsiiglobal.com,https://seller.gaarsiiglobal.com"
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
    networks: [suuq]
    deploy:
      replicas: 1
      update_config: { order: start-first }
      restart_policy: { condition: any }

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks: [suuq]
    deploy:
      replicas: 1
      restart_policy: { condition: any }

configs:
  caddyfile:
    file: ./Caddyfile

networks:
  suuq:
    driver: overlay

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  opensearch_data:
