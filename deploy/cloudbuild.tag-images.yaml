# Tag Ilyas's product images with their colour (altText) for per-colour gallery.
# Submit from the REPO ROOT so the CSV is in the build source.
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args: ['-c', 'cd ecommerce-backend && npm ci && npx ts-node src/database/tag-variant-images.ts']
    secretEnv: ['MONGODB_URI']
    env:
      - 'MONGODB_DB_NAME=ecommerce'
      - 'BACKFILL_SELLER=ilyas'
availableSecrets:
  secretManager:
    - versionName: 'projects/suuq-ecommerce/secrets/MONGODB_URI/versions/latest'
      env: 'MONGODB_URI'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'
