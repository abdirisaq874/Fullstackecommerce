# Create Ilyas's store and import all trendyol-products.csv products under it.
# Submit from the REPO ROOT so the CSV (repo root) is in the build source.
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args: ['-c', 'cd ecommerce-backend && npm ci && npx ts-node src/database/import-ilyas-products.ts']
    secretEnv: ['MONGODB_URI']
    env:
      - 'MONGODB_DB_NAME=ecommerce'
availableSecrets:
  secretManager:
    - versionName: 'projects/suuq-ecommerce/secrets/MONGODB_URI/versions/latest'
      env: 'MONGODB_URI'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
