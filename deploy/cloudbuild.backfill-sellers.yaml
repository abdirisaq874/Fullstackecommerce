# Assign every seller-less product to a themed seller store (one-off backfill).
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args: ['-c', 'npm ci && npx ts-node src/database/backfill-sellers.ts']
    secretEnv: ['MONGODB_URI']
    env:
      - 'MONGODB_DB_NAME=ecommerce'
availableSecrets:
  secretManager:
    - versionName: 'projects/suuq-ecommerce/secrets/MONGODB_URI/versions/latest'
      env: 'MONGODB_URI'
options:
  logging: CLOUD_LOGGING_ONLY
