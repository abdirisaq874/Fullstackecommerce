# Reusable Cloud Build config for the Next.js frontends.
# NEXT_PUBLIC_* values are inlined at build time, so they're passed as build
# args. Invoke with --substitutions for _IMAGE and the NEXT_PUBLIC_* values.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_NAME=${_SITE_NAME}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_APP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_STRIPE_PK}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_DSN=${_SENTRY_DSN}'
      - '-t'
      - '${_IMAGE}'
      - '.'
images:
  - '${_IMAGE}'
options:
  substitution_option: 'ALLOW_LOOSE'
