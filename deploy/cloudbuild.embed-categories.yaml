# Backfill category embeddings into MongoDB Atlas from Cloud Build.
# Reaches Atlas + OpenRouter (both public). Needs MONGODB_URI + OPENROUTER_API_KEY.
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args: ['-c', 'npm ci && npx ts-node src/database/seed-category-embeddings.ts']
    secretEnv: ['MONGODB_URI', 'OPENROUTER_API_KEY']
    env:
      - 'MONGODB_DB_NAME=ecommerce'
availableSecrets:
  secretManager:
    - versionName: 'projects/suuq-ecommerce/secrets/MONGODB_URI/versions/latest'
      env: 'MONGODB_URI'
    - versionName: 'projects/suuq-ecommerce/secrets/OPENROUTER_API_KEY/versions/latest'
      env: 'OPENROUTER_API_KEY'
options:
  logging: CLOUD_LOGGING_ONLY
