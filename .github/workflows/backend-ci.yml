name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'ecommerce-backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'ecommerce-backend/**'

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ecommerce-backend/package-lock.json'

      - name: Install dependencies
        run: cd ecommerce-backend && npm ci

      - name: Lint
        run: cd ecommerce-backend && npm run lint

      - name: Build
        run: cd ecommerce-backend && npm run build

      - name: Test
        run: cd ecommerce-backend && npm test
