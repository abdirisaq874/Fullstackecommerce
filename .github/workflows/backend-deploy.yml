name: Backend Deploy (Swarm)

# Build the API image, push to Artifact Registry, then rolling-update the
# Swarm service on the VM over a keyless IAP SSH tunnel (Workload Identity).
on:
  push:
    branches: [main]
    paths:
      - 'ecommerce-backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/ecommerce-backend
      SWARM_SERVICE: suuq_backend
      VM: suuq-swarm
      ZONE: us-central1-a
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build & push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./ecommerce-backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Rolling update on Swarm
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo docker service update --image $IMAGE:${{ github.sha }} $SWARM_SERVICE --with-registry-auth"
