name: Seller Portal Deploy (Swarm)

# Build the seller-portal image (NEXT_PUBLIC_* baked in from repo vars), push to
# Artifact Registry, then rolling-update the Swarm service over IAP SSH.
on:
  push:
    branches: [main]
    paths:
      - 'seller-portal-v2/**'
      - '.github/workflows/seller-portal-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/seller-portal
      SWARM_SERVICE: suuq_seller-portal
      VM: suuq-swarm
      ZONE: us-central1-a
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build & push
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.BACKEND_URL }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.SELLER_APP_URL }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./seller-portal-v2
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Rolling update on Swarm
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo docker service update --image $IMAGE:${{ github.sha }} $SWARM_SERVICE --with-registry-auth"
