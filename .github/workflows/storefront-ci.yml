name: Storefront CI

on:
  push:
    branches:
      - main
    paths:
      - 'storefront/**'
  pull_request:
    branches:
      - main
    paths:
      - 'storefront/**'

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'storefront/package-lock.json'

      - name: Install dependencies
        run: cd storefront && npm install --no-audit --no-fund

      - name: Lint
        run: cd storefront && npm run lint

      - name: Type check
        run: cd storefront && npm run typecheck

      - name: Build
        run: cd storefront && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_SITE_NAME: Suuq
