name: Storefront Deploy (Swarm)

# Build the storefront image (NEXT_PUBLIC_* baked in from repo vars), push to
# Artifact Registry, then rolling-update the Swarm service over IAP SSH.
on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/storefront
      SWARM_SERVICE: suuq_storefront
      VM: suuq-swarm
      ZONE: us-central1-a
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build & push
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.BACKEND_URL }}" \
            --build-arg NEXT_PUBLIC_SITE_NAME="${{ vars.NEXT_PUBLIC_SITE_NAME }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_META_PIXEL_ID="${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}" \
            --build-arg NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY="${{ vars.NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY }}" \
            --build-arg NEXT_PUBLIC_OPENREPLAY_INGEST_POINT="${{ vars.NEXT_PUBLIC_OPENREPLAY_INGEST_POINT }}" \
            --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER="${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./storefront
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Rolling update on Swarm
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo docker service update --image $IMAGE:${{ github.sha }} $SWARM_SERVICE --with-registry-auth"
