name: Seller Portal CI

on:
  push:
    branches:
      - main
    paths:
      - 'seller-portal-v2/**'
  pull_request:
    branches:
      - main
    paths:
      - 'seller-portal-v2/**'

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'seller-portal-v2/package-lock.json'

      - name: Install dependencies
        run: cd seller-portal-v2 && npm install --no-audit --no-fund

      - name: Lint
        run: cd seller-portal-v2 && npm run lint

      - name: Type check
        run: cd seller-portal-v2 && npm run type-check

      - name: Test
        run: cd seller-portal-v2 && npm test

      - name: Build
        run: cd seller-portal-v2 && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3001
