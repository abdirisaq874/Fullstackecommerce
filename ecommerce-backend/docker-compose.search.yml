# ───────────────────────────────────────────────────────────────────────────
# Smart-search TEST stack: OpenSearch + Dashboards + Redis
#
# For a team test box (e.g. a GCloud VM on the $300 trial):
#   docker compose -f docker-compose.search.yml up -d
#
# Single-node, security DISABLED — TEST ONLY. Do not expose publicly.
# OpenSearch ships k-NN (vector search) built in; no plugin install needed.
# ───────────────────────────────────────────────────────────────────────────
services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: ecom-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g" # bump on a larger box
      - DISABLE_SECURITY_PLUGIN=true # TEST ONLY
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200" # REST API  -> OPENSEARCH_NODE=http://localhost:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: ecom-opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true # TEST ONLY
    ports:
      - "5601:5601" # http://localhost:5601 — relevance tuning / index inspection
    depends_on:
      opensearch:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  opensearch-data:
  redis-data:
